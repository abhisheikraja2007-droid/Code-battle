<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CodeBattle - Coding Contest</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>CodeBattle</h1>
            <p>Enter the ultimate coding challenge</p>
        </header>

        <main>
            <!-- using novalidate because we handle validation with JS -->
            <form id="contestForm" class="contest-form" novalidate>

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" required />
                    <span class="error-message" id="nameError" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="roll">Roll Number *</label>
                    <input type="text" id="roll" name="roll" required />
                    <span class="error-message" id="rollError" aria-live="polite"></span>
                </div>

                <!-- ⭐ Class as Textbox -->
                <div class="form-group">
                    <label for="classInput">Class *</label>
                    <input type="text" id="classInput" name="classInput" required />
                    <span class="error-message" id="classError" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required />
                    <span class="error-message" id="emailError" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="language">Preferred Programming Language *</label>
                    <select id="language" name="language" required>
                        <option value="">Select a language</option>
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="csharp">C#</option>
                        <option value="cpp">C++</option>
                        <option value="other">Other</option>
                    </select>
                    <span class="error-message" id="languageError" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label>Experience Level *</label>
                    <div class="radio-group" role="radiogroup" aria-labelledby="experienceLabel">
                        <label>
                            <input type="radio" name="experience" value="beginner" required />
                            Beginner
                        </label>
                        <label>
                            <input type="radio" name="experience" value="intermediate" />
                            Intermediate
                        </label>
                        <label>
                            <input type="radio" name="experience" value="advanced" />
                            Advanced
                        </label>
                    </div>
                    <span class="error-message" id="experienceError" aria-live="polite"></span>
                </div>

                <button type="submit" class="submit-btn">Enter Contest</button>
            </form>
        </main>

        <div id="successMessage" class="success-message" role="status" aria-live="polite" aria-hidden="true">
            <h2>Registration Successful!</h2>
            <p>Thank you for registering for CodeBattle. We've sent a confirmation email to 
                <span id="userEmail"></span>.
            </p>
            <button id="submitAnother" class="submit-btn">Submit Another Entry</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
